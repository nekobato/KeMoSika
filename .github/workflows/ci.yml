name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            os: ubuntu-latest
            command: pnpm run lint
          - check: test
            os: macos-latest
            command: node --test 'src/**/*.test.ts'
          - check: build
            os: macos-latest
            command: pnpm exec electron-vite build && pnpm exec electron-builder --config electron-builder.config.cjs --publish never

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
